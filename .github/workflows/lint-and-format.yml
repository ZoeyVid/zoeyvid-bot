name: lint-and-format
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lint-and-format:
    runs-on: ubuntu-slim
    env:
      BIOME: ${{ github.event_name == 'pull_request' && 'ci' || 'check --write' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: latest
      - name: eslint
        run: |
          set -x
          pnpm install --frozen-lockfile
          pnpm biome $BIOME --reporter=default --reporter=github || echo "BIOME_FAILED=1" >> "$GITHUB_ENV"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          signoff: true
          delete-branch: true
          commit-message: lint-and-format
          branch: lint-and-format
          title: lint-and-format
          body: lint-and-format
      - name: diff
        if: ${{ github.event_name == 'pull_request' }}
        run: git diff --exit-code
      - name: biome
        if: ${{ env.BIOME_FAILED == '1' }}
        run: exit 1
