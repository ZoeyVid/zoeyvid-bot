name: lint-and-format
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lint-and-format:
    runs-on: ubuntu-slim
    env:
      BIOME: ${{ github.event_name == 'pull_request' && 'ci' || 'check --write' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: latest
      - name: eslint
        run: |
          set -x
          pnpm install --frozen-lockfile
          pnpm biome $BIOME --reporter=default --reporter=github || echo "BIOME_FAILED=1" >> "$GITHUB_ENV"
      - uses: peter-evans/create-pull-request@v8.1.3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: true
          delete-branch: true
          commit-message: lint-and-format
          branch: lint-and-format
          title: lint-and-format
          body: lint-and-format
      - name: diff
        if: ${{ github.event_name == 'pull_request' }}
        run: git diff --exit-code
      - name: biome
        if: ${{ env.BIOME_FAILED == '1' }}
        run: exit 1
